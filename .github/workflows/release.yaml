name: Release on Google Bucket
on:
  push:
    branches:
      - main
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: "auth"
        uses: "google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed" # v2.1.13
        with:
          workload_identity_provider: "projects/1019539084286/locations/global/workloadIdentityPools/github/providers/sourcify"
          service_account: "sourcify-playground-cd@sourcify-project.iam.gserviceaccount.com"
      - name: Set up Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: "16"
      - name: Install dependencies
        run: npm install
        env:
          CI: false
      - name: Build
        run: npm run build
        env:
          CI: false
      - name: "upload-files"
        uses: "google-github-actions/upload-cloud-storage@c0f6160ff80057923ff50e5e567695cea181ec23" # v2.2.4
        with:
          path: "build"
          destination: "sourcify-playground-bucket"
          parent: false
          glob: "**/*"